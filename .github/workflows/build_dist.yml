name: build
on:
  workflow_dispatch:
  pull_request:
jobs:
  build_linux:
    name: Build binaries - manylinux_2_28_x86_64
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
    env:
      JULIA_PKG_USE_CLI_GIT: "true"
    steps:
    - uses: actions/checkout@v4
    # Temporary workaround: SSH_PRIVATE_KEY secret is not configured.
    # All git@github.com deps (e.g. MadNLP/CCOpt.jl) are public, so route
    # them through HTTPS instead. Revert if a private dep is added.
    - name: rewrite SSH git URLs to HTTPS
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"
    - uses: julia-actions/install-juliaup@v2
      with:
        channel: ${{ matrix.julia-version }}
    # Get a patched version of JuliaC
    - name: install JuliaC
      run: julia -e 'using Pkg; Pkg.add(url="https://github.com/apozharski/JuliaC.jl.git"); Pkg.Apps.add(url="https://github.com/apozharski/JuliaC.jl.git")'
    - name: add JuliaC to path
      run: echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
    - name: build libMad
      run: mkdir build && cd build && mkdir install && cmake .. -DCMAKE_INSTALL_PREFIX="install" && cmake --build . --target install --config Release
    - name: trim out unnecessary artifacts
      run: cd build/install/share/julia/artifacts && rm -rf $(julia --project=${{ github.workspace }} ${{ github.workspace }}/scripts/trim_cuda_artifacts.jl)
    - name: install auditwheel
      run: python3 -m pip install --quiet auditwheel
    - name: inspect libMad.so manylinux compliance
      run: |
        set -e
        SO=$(find build/install -name 'libMad.so*' -type f | head -1)
        echo "=== $SO ==="
        file "$SO"
        echo
        echo "=== NEEDED (DT_NEEDED) ==="
        objdump -p "$SO" | grep NEEDED
        echo
        echo "=== ldd ==="
        ldd "$SO" || true
        echo
        echo "=== required GLIBC versions ==="
        objdump -T "$SO" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu
        echo
        echo "=== required GLIBCXX versions ==="
        (objdump -T "$SO" | grep -oE 'GLIBCXX_[0-9.]+' | sort -Vu) || echo "(none)"
        echo
        echo "=== auditwheel lddtree ==="
        python3 -m auditwheel lddtree "$SO" || true
    - uses: actions/upload-artifact@v4
      with:
        name: libMad-manylinux_2_28_x86_64
        path: build/install
        if-no-files-found: error

  build_windows:
    name: Build binaries - windows-latest
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
    env:
      JULIA_PKG_USE_CLI_GIT: "true"
    steps:
    - uses: actions/checkout@v4
    # Temporary workaround: SSH_PRIVATE_KEY secret is not configured.
    # All git@github.com deps (e.g. MadNLP/CCOpt.jl) are public, so route
    # them through HTTPS instead. Revert if a private dep is added.
    - name: rewrite SSH git URLs to HTTPS
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"
    - uses: julia-actions/install-juliaup@v2
      with:
        channel: ${{ matrix.julia-version }}
    - name: install JuliaC
      run: julia -e 'using Pkg; Pkg.add(url="https://github.com/apozharski/JuliaC.jl.git"); Pkg.Apps.add(url="https://github.com/apozharski/JuliaC.jl.git")'
    - name: add JuliaC to path
      run: echo "PATH=$HOME\.julia\bin;$env:PATH" >> $env:GITHUB_ENV
      shell: pwsh
    - name: build libMad
      run: mkdir build && cd build && mkdir install && cmake .. -DCMAKE_INSTALL_PREFIX="install" && cmake --build . --target INSTALL --config Release
    - name: trim out unnecessary artifacts
      run: |
        function quiet_rm($items)
        {
          foreach($item in $items)
          {
            if (Test-Path $item)
            {
              echo "  Removing $item"
              Remove-Item $item  -r -force
            }
          }
        }
        cd build/install/share/julia/artifacts && quiet_rm $(julia --project=${{ github.workspace }} ${{ github.workspace }}/scripts/trim_cuda_artifacts.jl)

  build_apple:
    name: Build binaries - mac-latest
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
    env:
      JULIA_PKG_USE_CLI_GIT: "true"
    steps:
    - uses: actions/checkout@v4
    # Temporary workaround: SSH_PRIVATE_KEY secret is not configured.
    # All git@github.com deps (e.g. MadNLP/CCOpt.jl) are public, so route
    # them through HTTPS instead. Revert if a private dep is added.
    - name: rewrite SSH git URLs to HTTPS
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"
    - uses: julia-actions/install-juliaup@v2
      with:
        channel: ${{ matrix.julia-version }}
    - name: install JuliaC
      run: julia -e 'using Pkg; Pkg.add(url="https://github.com/apozharski/JuliaC.jl.git"); Pkg.Apps.add(url="https://github.com/apozharski/JuliaC.jl.git")'
    - name: add JuliaC to path
      run: echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
    - name: build libMad
      run: mkdir build && cd build && mkdir install && cmake .. -DCMAKE_INSTALL_PREFIX="install" && cmake --build . --target install --config Release
    - name: trim out unnecessary artifacts
      run: cd build/install/share/julia/artifacts && rm -rf $(julia --project=${{ github.workspace }} ${{ github.workspace }}/scripts/trim_cuda_artifacts.jl)
